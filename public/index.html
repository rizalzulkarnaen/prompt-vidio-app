<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt → Video AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>🎬 Prompt → Video AI</h1>
    <p class="sub">Tulis ide, pilih rasio, lalu generate. Hasil muncul di bawah.</p>

    <label>Prompt</label>
    <textarea id="prompt" rows="4" placeholder="Contoh: kucing oranye memakai kacamata hitam berjalan di kota neon, sinematik, hujan malam"></textarea>

    <div class="row">
      <div>
        <label>Aspect Ratio</label>
        <select id="ratio">
          <option value="16:9">16:9 (YouTube)</option>
          <option value="9:16">9:16 (Reels/TikTok)</option>
          <option value="1:1">1:1 (Feed)</option>
        </select>
      </div>
      <div>
        <label>Durasi (detik)</label>
        <select id="duration">
          <option value="5">5 detik</option>
          <option value="10">10 detik</option>
        </select>
      </div>
    </div>

    <button id="btn">Generate Video</button>

    <div id="status" class="status"></div>

    <div id="result" class="result hidden">
      <video id="video" controls playsinline></video>
      <a id="download" download="hasil.mp4">⬇️ Unduh</a>
    </div>

    <h2 class="hist-title">Riwayat Sesi Ini</h2>
    <div id="history" class="history"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
